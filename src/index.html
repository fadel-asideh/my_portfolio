<!doctype html>
<!--
  =============================================================================
  index.html — the single HTML page that hosts the Angular app.
  - <base href="/"> is replaced at build time for GitHub Pages
    (see docs/DEPLOYMENT.md and .github/workflows/deploy.yml).
  - The small inline script applies the saved theme BEFORE Angular starts,
    so visitors with dark mode never see a white flash.
  =============================================================================
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fadel Asideh · Fullstack Developer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Fadel Asideh — Fullstack developer (C#/.NET, Python/FastAPI, TypeScript/NestJS) based in Fürth, Germany."
    />
    <meta name="theme-color" content="#ffc93c" />

    <!-- Social preview (LinkedIn, Slack, WhatsApp …) -->
    <meta property="og:title" content="Fadel Asideh · Fullstack Developer" />
    <meta
      property="og:description"
      content="Backend-focused fullstack developer. APIs, databases, clean architecture — and good vibes."
    />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Fonts: Fredoka (playful headings), Nunito (friendly body), JetBrains Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply theme before first paint (mirrors ThemeService logic). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* storage blocked → just use the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <p style="font-family: sans-serif; padding: 2rem; text-align: center">
        This portfolio needs JavaScript to smile at you 🙂 — please enable it.
      </p>
    </noscript>
  </body>
</html>
