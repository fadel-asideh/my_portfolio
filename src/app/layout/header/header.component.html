<!--
  HEADER TEMPLATE
  Layout:  [logo]  ············  [menu links]  [DE/EN] [☀/🌙] [☰ mobile]
-->
<header
  class="fixed inset-x-0 top-0 z-50 border-b-2 border-transparent transition-all duration-300"
  [class]="scrolled() ? 'border-line/10! bg-surface/80 backdrop-blur-md' : ''"
>
  <nav class="mx-auto flex h-18 max-w-6xl items-center justify-between gap-4 px-5" aria-label="Main">
    <!-- Logo: the waving hand waves forever, because hello is always nice -->
    <a href="#top" class="group flex items-center gap-2 font-display text-xl font-bold" (click)="closeMenu()">
      <span class="inline-block origin-[70%_70%] animate-wave text-2xl" aria-hidden="true">👋</span>
      <span>fadel<span class="text-coral group-hover:text-grape">.</span>dev</span>
    </a>

    <!-- Desktop menu (hidden on small screens) -->
    <ul class="hidden items-center gap-1 lg:flex">
      @for (item of navItems; track item.sectionId) {
        <li>
          <a
            [href]="'#' + item.sectionId"
            class="rounded-full px-3 py-1.5 font-display font-medium transition-colors hover:bg-sun/40"
            [class]="scrollSpy.activeId() === item.sectionId ? 'bg-sun text-[#1d1b2f]' : ''"
            [attr.aria-current]="scrollSpy.activeId() === item.sectionId ? 'true' : null"
          >
            {{ item.labelKey | t }}
          </a>
        </li>
      }
    </ul>

    <!-- Toggles -->
    <div class="flex items-center gap-2">
      <!-- Language: shows the language you will switch TO -->
      <button
        type="button"
        class="icon-btn font-display text-sm font-bold uppercase"
        [attr.aria-label]="'header.toggleLanguage' | t"
        [title]="'header.toggleLanguage' | t"
        (click)="language.toggle()"
      >
        {{ language.current() === 'en' ? 'DE' : 'EN' }}
      </button>

      <!-- Theme: sun ↔ moon with a little spin -->
      <button
        type="button"
        class="icon-btn"
        [attr.aria-label]="'header.toggleTheme' | t"
        [attr.aria-pressed]="theme.isDark()"
        [title]="'header.toggleTheme' | t"
        (click)="toggleTheme()"
      >
        @if (theme.isDark()) {
          <app-icon name="moon" class="size-5 animate-pop-in text-sun" />
        } @else {
          <app-icon name="sun" class="size-5 animate-pop-in text-coral" />
        }
      </button>

      <!-- Mobile menu button -->
      <button
        type="button"
        class="icon-btn lg:hidden"
        [attr.aria-label]="(menuOpen() ? 'header.closeMenu' : 'header.openMenu') | t"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        (click)="toggleMenu()"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" class="size-5" />
      </button>
    </div>
  </nav>

  <!-- Mobile menu panel -->
  @if (menuOpen()) {
    <div id="mobile-menu" class="px-5 pb-5 lg:hidden">
      <ul class="sticker grid animate-pop-in grid-cols-2 gap-2 p-3">
        @for (item of navItems; track item.sectionId) {
          <li>
            <a
              [href]="'#' + item.sectionId"
              class="flex items-center gap-2 rounded-2xl px-3 py-2.5 font-display font-medium hover:bg-sun/40"
              (click)="closeMenu()"
            >
              <span aria-hidden="true">{{ item.emoji }}</span>
              {{ item.labelKey | t }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</header>
